<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>CalTrack</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#707070;--accent:#111;--border:#e7e7e7;--green:#27a269}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;color:var(--text)}
.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}
header{padding:20px 2px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:0;font-weight:800}button{font:inherit;border:0;cursor:pointer}.icon{width:42px;height:42px;border-radius:14px;background:#fff;font-size:21px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:10px 0;box-shadow:0 2px 12px #00000008}
.date{color:var(--muted);font-size:14px;margin-top:4px}
.cal{display:flex;align-items:center;gap:20px}.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p),#e9e9e9 0);position:relative}.ring:after{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}.ringtext{position:relative;z-index:1;text-align:center}.ringtext b{display:block;font-size:25px}.ringtext span{font-size:11px;color:var(--muted)}
.stats{flex:1}.big{font-size:30px;font-weight:800}.muted{color:var(--muted);font-size:13px}.bar{height:9px;background:#ededed;border-radius:9px;overflow:hidden;margin:8px 0 13px}.fill{height:100%;border-radius:9px}.macro{display:flex;justify-content:space-between;font-size:13px}.green{background:var(--green)}
.section-title{font-size:18px;font-weight:800;margin:22px 2px 10px}
.meal{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}.meal:last-child{border-bottom:0}.mealname{font-weight:700}.foodline{font-size:13px;color:var(--muted);margin-top:3px}
.add{width:34px;height:34px;border-radius:11px;background:#111;color:#fff;font-size:20px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}.addbig{background:#111;color:#fff;border-radius:17px;padding:14px 26px;font-weight:800}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:5}.sheet{background:#fff;border-radius:26px 26px 0 0;padding:20px;max-width:520px;width:100%;margin:auto;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:#fff}.full{grid-column:1/-1}.save{width:100%;padding:15px;background:#111;color:#fff;border-radius:14px;margin-top:14px;font-weight:800}.close{float:right;background:#eee;width:34px;height:34px;border-radius:50%}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.micro{margin:13px 0}.microhead{display:flex;justify-content:space-between;align-items:center;font-size:14px}.microname{font-weight:700}.microval{color:var(--muted);font-size:12px}.microbar{height:8px;background:#ededed;border-radius:8px;overflow:hidden;margin-top:6px}.microfill{height:100%;border-radius:8px;background:#111}

</style>
</head>
<body>
<div class="app">
<header><div><h1>CalTrack</h1><div class="date" id="today"></div></div><button class="icon" onclick="openSettings()">⚙️</button></header>

<div class="card">
  <div class="cal">
    <div class="ring" id="ring"><div class="ringtext"><b id="remaining">0</b><span>remaining</span></div></div>
    <div class="stats">
      <div class="muted">Calories</div>
      <div class="big"><span id="eaten">0</span> / <span id="target">2800</span></div>
      <div class="bar"><div class="fill" id="calbar"></div></div>
      <div class="macro"><span>Protein <b id="protein">0</b>g</span><span>Carbs <b id="carbs">0</b>g</span><span>Fat <b id="fat">0</b>g</span></div>
    </div>
  </div>
</div>

<div class="section-title">Today</div>
<div class="card" id="meals"></div>


<div class="section-title">Micronutrients</div>
<div class="card" id="micros"></div>

<div class="section-title">Quick add</div>
<div class="card">
  <button class="addbig" onclick="openAdd()">＋ Add food</button>
</div>
</div>

<div class="bottom"><button class="addbig" onclick="openAdd()">＋ Add food</button></div>

<div class="modal" id="modal">
 <div class="sheet">
  <button class="close" onclick="closeModal()">×</button><h2>Add food</h2>
  <div class="grid">
   <div class="full"><label>Food</label><input id="food" placeholder="e.g. chicken breast"></div>
   <div><label>Calories</label><input id="cals" type="number" placeholder="450"></div>
   <div><label>Meal</label><select id="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div>
   <div><label>Protein (g)</label><input id="p" type="number" placeholder="35"></div>
   <div><label>Carbs (g)</label><input id="c" type="number" placeholder="40"></div>
   <div><label>Fat (g)</label><input id="f" type="number" placeholder="12"></div>
   <div><label>Sodium (mg)</label><input id="sodium" type="number" placeholder="500"></div>
   <div><label>Potassium (mg)</label><input id="potassium" type="number" placeholder="400"></div>
   <div><label>Calcium (mg)</label><input id="calcium" type="number" placeholder="150"></div>
   <div><label>Iron (mg)</label><input id="iron" type="number" placeholder="2"></div>
   <div><label>Magnesium (mg)</label><input id="magnesium" type="number" placeholder="40"></div>
   <div><label>Zinc (mg)</label><input id="zinc" type="number" placeholder="2"></div>
   <div><label>Vitamin A (µg)</label><input id="vitaminA" type="number" placeholder="100"></div>
   <div><label>Vitamin D (µg)</label><input id="vitaminD" type="number" placeholder="2"></div>
   <div><label>Vitamin C (mg)</label><input id="vitaminC" type="number" placeholder="30"></div>
   <div><label>Vitamin B12 (µg)</label><input id="vitaminB12" type="number" placeholder="1"></div>
   <div><label>Vitamin B6 (mg)</label><input id="vitaminB6" type="number" placeholder="0.5"></div>
   <div><label>Folate (µg)</label><input id="folate" type="number" placeholder="50"></div>
   <div><label>Vitamin E (mg)</label><input id="vitaminE" type="number" placeholder="2"></div>
   <div><label>Vitamin K (µg)</label><input id="vitaminK" type="number" placeholder="20"></div>
   <div><label>Fibre (g)</label><input id="fibre" type="number" placeholder="5"></div>
   <div><label>Saturated fat (g)</label><input id="saturatedFat" type="number" placeholder="3"></div>

  </div>
  <button class="save" onclick="saveFood()">Add to today</button>
 </div>
</div>

<div class="modal" id="settings">
 <div class="sheet">
  <button class="close" onclick="closeSettings()">×</button><h2>Daily target</h2>
  <label>Calories</label><input id="targetInput" type="number" value="2800">
  <label style="margin-top:12px">Protein target (g)</label><input id="proteinTarget" type="number" value="160">
  <button class="save" onclick="saveSettings()">Save targets</button>
 </div>
</div>

<script>
const KEY="caltrack_v1";
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{target:2800,proteinTarget:160,days:{},microTargets:{sodium:2300,potassium:3400,calcium:1000,iron:8,magnesium:400,zinc:11,vitaminA:900,vitaminD:15,vitaminC:90,vitaminB12:2.4,vitaminB6:1.3,folate:400,vitaminE:15,vitaminK:120,fibre:38,saturatedFat:20}};
const key=()=>new Date().toISOString().slice(0,10);
const defaultMicroTargets={sodium:2300,potassium:3400,calcium:1000,iron:8,magnesium:400,zinc:11,vitaminA:900,vitaminD:15,vitaminC:90,vitaminB12:2.4,vitaminB6:1.3,folate:400,vitaminE:15,vitaminK:120,fibre:38,saturatedFat:20};
state.microTargets={...defaultMicroTargets,...(state.microTargets||{})};
function day(){let k=key(); if(!state.days[k])state.days[k]=[]; return state.days[k]}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function openAdd(){document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function openSettings(){document.getElementById('settings').style.display='flex';document.getElementById('targetInput').value=state.target;document.getElementById('proteinTarget').value=state.proteinTarget;
 Object.keys(defaultMicroTargets).forEach(k=>{const el=document.getElementById('t'+k);if(el)el.value=state.microTargets[k]});}
function closeSettings(){document.getElementById('settings').style.display='none'}
function saveSettings(){state.target=+targetInput.value||2800;state.proteinTarget=+proteinTarget.value||160;
 Object.keys(defaultMicroTargets).forEach(k=>{const el=document.getElementById('t'+k);if(el)state.microTargets[k]=+el.value||defaultMicroTargets[k]});
 persist();closeSettings();render()}
function saveFood(){
 const x={food:food.value.trim()||"Food",cals:+cals.value||0,meal:meal.value,p:+p.value||0,c:+c.value||0,f:+f.value||0,
 sodium:+document.getElementById('sodium').value||0,potassium:+document.getElementById('potassium').value||0,calcium:+document.getElementById('calcium').value||0,iron:+document.getElementById('iron').value||0,magnesium:+document.getElementById('magnesium').value||0,zinc:+document.getElementById('zinc').value||0,vitaminA:+document.getElementById('vitaminA').value||0,vitaminD:+document.getElementById('vitaminD').value||0,vitaminC:+document.getElementById('vitaminC').value||0,vitaminB12:+document.getElementById('vitaminB12').value||0,vitaminB6:+document.getElementById('vitaminB6').value||0,folate:+document.getElementById('folate').value||0,vitaminE:+document.getElementById('vitaminE').value||0,vitaminK:+document.getElementById('vitaminK').value||0,fibre:+document.getElementById('fibre').value||0,saturatedFat:+document.getElementById('saturatedFat').value||0};
 day().push(x);persist();['food','cals','p','c','f','sodium','potassium','calcium','iron','magnesium','zinc','vitaminA','vitaminD','vitaminC','vitaminB12','vitaminB6','folate','vitaminE','vitaminK','fibre','saturatedFat'].forEach(id=>document.getElementById(id).value='');closeModal();render()
}
function render(){
 const d=day(), sum=(k)=>d.reduce((a,x)=>a+x[k],0), e=sum('cals'),p=sum('p'),c=sum('c'),f=sum('f'), rem=Math.max(state.target-e,0), pct=Math.min(e/state.target,1);
 today.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
 eaten.textContent=Math.round(e);target.textContent=Math.round(state.target);remaining.textContent=Math.round(rem);
 protein.textContent=Math.round(p);carbs.textContent=Math.round(c);fat.textContent=Math.round(f);
 calbar.style.width=(pct*100)+'%';ring.style.setProperty('--p',(pct*360)+'deg');
 const microMeta=[
  ['sodium','Sodium','mg'],['potassium','Potassium','mg'],['calcium','Calcium','mg'],['iron','Iron','mg'],
  ['magnesium','Magnesium','mg'],['zinc','Zinc','mg'],['vitaminA','Vitamin A','µg'],['vitaminD','Vitamin D','µg'],
  ['vitaminC','Vitamin C','mg'],['vitaminB12','Vitamin B12','µg'],['vitaminB6','Vitamin B6','mg'],['folate','Folate','µg'],
  ['vitaminE','Vitamin E','mg'],['vitaminK','Vitamin K','µg'],['fibre','Fibre','g'],['saturatedFat','Saturated fat','g']
 ];
 document.getElementById('micros').innerHTML=microMeta.map(([k,n,u])=>{
   const v=d.reduce((a,x)=>a+(+x[k]||0),0), t=state.microTargets[k]||1, q=Math.min(v/t,1)*100;
   return `<div class="micro"><div class="microhead"><span class="microname">${n}</span><span class="microval">${Number(v.toFixed(1))} / ${t} ${u}</span></div><div class="microbar"><div class="microfill" style="width:${q}%"></div></div></div>`;
 }).join('');

 const meals=['Breakfast','Lunch','Dinner','Snack'];
 document.getElementById('meals').innerHTML=meals.map(m=>{
   const xs=d.filter(x=>x.meal===m), total=xs.reduce((a,x)=>a+x.cals,0);
   return `<div class="meal"><div><div class="mealname">${m}</div><div class="foodline">${xs.length?xs.map(x=>x.food).join(', '):'Nothing logged'}</div></div><div><b>${Math.round(total)} kcal</b> <button class="add" onclick="openAddMeal('${m}')">+</button></div></div>`
 }).join('');
}
function openAddMeal(m){openAdd();meal.value=m}
render();
</script>
</body></html>
